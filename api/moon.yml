$schema: '../.moon/cache/schemas/project.json'

language: 'go'
stack: 'backend'
layer: 'application'

fileGroups:
  sources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'

tasks:
  dev:
    command: 'go run .'
    preset: 'server'

  build:
    command: 'go build -o bin/server .'
    inputs:
      - '@group(sources)'
    outputs:
      - 'bin/server'

  test:
    command: 'go test ./...'
    inputs:
      - '@group(sources)'

  vet:
    command: 'go vet ./...'
    inputs:
      - '@group(sources)'
